<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" role="img" aria-label="Capi Studio">
  <defs>
    <linearGradient id="capyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="studioGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="#121218"/>
  <!-- Low-poly capybara silhouette -->
  <g transform="translate(50, 40)">
    <polygon points="40,180 80,140 120,150 100,200" fill="#a21caf"/>
    <polygon points="80,140 140,120 160,160 120,150" fill="#9333ea"/>
    <polygon points="140,120 200,110 210,150 160,160" fill="#7c3aed"/>
    <polygon points="200,110 260,115 250,155 210,150" fill="#4f46e5"/>
    <polygon points="260,115 300,130 280,170 250,155" fill="#2563eb"/>
    <polygon points="300,130 320,160 290,185 280,170" fill="#0891b2"/>
    <polygon points="100,200 160,160 210,150 180,210" fill="#6d28d9"/>
    <polygon points="180,210 210,150 250,155 230,220" fill="#4338ca"/>
    <polygon points="230,220 250,155 280,170 260,230" fill="#1d4ed8"/>
    <polygon points="120,150 160,160 140,200 100,200" fill="#7e22ce"/>
    <polygon points="160,160 210,150 200,200 140,200" fill="#5b21b6"/>
    <polygon points="200,200 210,150 250,155 240,205" fill="#3730a3"/>
    <polygon points="240,205 250,155 280,170 270,215" fill="#1e40af"/>
    <polygon points="270,215 280,170 290,185 285,225" fill="#0e7490"/>
    <polygon points="285,225 290,185 310,200 300,235" fill="#06b6d4"/>
    <polygon points="300,130 320,160 310,200 290,185" fill="#0284c7"/>
    <polygon points="310,200 320,160 330,190 325,220" fill="#22d3ee"/>
    <!-- Legs -->
    <polygon points="140,200 160,240 130,250 110,210" fill="#581c87"/>
    <polygon points="200,200 220,245 190,255 170,210" fill="#312e81"/>
    <polygon points="240,205 255,250 225,258 210,215" fill="#1e3a8a"/>
    <polygon points="270,215 285,260 255,265 240,220" fill="#155e75"/>
  </g>
  <!-- CAPI -->
  <text x="200" y="340" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="8">C^PI</text>
  <!-- STUDIO with lines -->
  <line x1="80" y1="375" x2="130" y2="375" stroke="#9333ea" stroke-width="2"/>
  <line x1="270" y1="375" x2="320" y2="375" stroke="#06b6d4" stroke-width="2"/>
  <text x="200" y="385" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="500" fill="url(#studioGradient)" letter-spacing="12">STUDIO</text>
</svg>
