# A string used to distinguish different Supabase projects on the same host.
project_id = "capistudio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://capistudio.com",
  "https://www.capistudio.com",
  "http://localhost:5173/admin",
  "https://capistudio.com/admin",
  "https://www.capistudio.com/admin"
]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

# Google OAuth — produção: configure no Supabase Dashboard (Authentication > Providers > Google).
# Local: defina GOOGLE_CLIENT_ID e GOOGLE_CLIENT_SECRET no .env e habilite abaixo.
# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_CLIENT_SECRET)"
# skip_nonce_check = false
