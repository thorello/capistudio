spring:
  application:
    name: capistudio-api
  datasource:
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USER:}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  jooq:
    sql-dialect: postgres

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:capistudio-api}
  traces:
    exporter: otlp
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}

logging:
  level:
    root: INFO
    com.capistudio: INFO
